name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub 웹페이지에서 수동으로 빌드 버튼을 눌러 실행 가능

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease

      - name: Rename APKs for Easy Download
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/app-debug.apk output-apk/CalcExchange-debug.apk
          cp app/build/outputs/apk/release/app-release.apk output-apk/CalcExchange-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcExchange-Debug-APK
          path: output-apk/CalcExchange-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalcExchange-Release-APK
          path: output-apk/CalcExchange-release.apk
          if-no-files-found: error

